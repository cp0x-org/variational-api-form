:root {
  color-scheme: dark;
  --bg: #16161f;
  --surface: #1e1e26;
  --back: #16161e;
  --line: #39454b;
  --line-hover: #525f66;
  --text: #ededed;
  --muted: #7a8d9a;
  --cyan: #28e5e5;
  --pad: clamp(18px, 5vw, 36px);
  font-family: 'Montserrat', system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  padding: 24px 16px 32px;
  background: radial-gradient(
    ellipse at 52% 43%,
    rgb(40 229 229 / 4%),
    transparent 62%
  );
}

.drop {
  width: 100%;
  max-width: 540px;
  min-width: 0;
  margin: auto;
}

.perch {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-inline: var(--pad) clamp(16px, 5vw, 32px);
}

.logo {
  display: block;
  width: 63px;
  height: 26px;
  margin-bottom: clamp(16px, 4vw, 24px);
  color: var(--text);
}

.mascot {
  display: block;
  width: clamp(112px, 34vw, 178px);
  flex: none;
  pointer-events: none;
}

.card {
  position: relative;
  padding: clamp(24px, 6vw, 36px) var(--pad) 17px;
  border: 1px solid var(--line);
  border-top-color: var(--line-hover);
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 5px 0 -1px var(--back), 0 6px 0 -1px var(--line);
}

h1 {
  margin: 0;
  font-size: clamp(1.48rem, 5.8vw, 2.18rem);
  font-weight: 650;
  line-height: 1.16;
  letter-spacing: -0.045em;
  text-wrap: balance;
}

h1 span {
  display: inline-block;
  color: var(--cyan);
}

.caption {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: clamp(0.8125rem, 2.8vw, 0.9rem);
  line-height: 1.55;
  text-wrap: pretty;
}

#form {
  margin-top: clamp(22px, 5vw, 30px);
}

#addr {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 54px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--back);
  color: var(--text);
  caret-color: var(--cyan);
  font: 400 16px/1.5 'Space Mono', ui-monospace, monospace;
}

#addr::placeholder {
  color: var(--muted);
  opacity: 1;
}

.delivery {
  margin-top: 12px;
}

#send {
  width: 100%;
  min-height: 48px;
  padding: 12px 10px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--cyan);
  color: var(--back);
  font: 700 1rem/1.35 'Montserrat', system-ui, sans-serif;
  cursor: pointer;
}

@media (hover: hover) {
  #addr:hover {
    border-color: var(--line-hover);
  }

  #send:hover:enabled {
    background: #2cfffe;
  }
}

#send:active:enabled {
  background: #19b4b4;
}

#send:disabled {
  border-color: var(--line);
  background: var(--back);
  color: var(--muted);
  cursor: wait;
}

#addr:focus-visible,
#send:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

#status {
  min-height: 1.5em;
  margin: 8px 0 0;
  font-size: 0.8125rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

#status[data-state="error"],
#status[data-state="fail"] {
  color: #ff4444;
}

#status[data-state="sending"] {
  color: var(--muted);
}

#status[data-state="ok"] {
  color: #23d92b;
}
</style>
</head>

    <p class="caption">Address only. No email or sign-up needed.</p>
    <form id="form">
      <input id="addr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0x…" aria-label="EVM address" enterkeyhint="send">

      </div>

</main>

<script>
    'use strict';

    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzE9JXjMDmWfkRBRGOqo1DQImIjab8MNEK4wdHli4gpCKWd5b4eZ4NOw4PDc7Qk4Ij9SQ/exec';
    const MESSAGES = {
      empty: 'Paste an address.',
      format: 'This is not an EVM address: it needs 0x and 40 characters 0–9, a–f.',
      checksum: 'There is a typo in the address: the checksum does not match. Copy the address again.',
      sending: 'Sending…',
      ok: 'Address received.',
      fail: 'It did not go through. Please try again.',
    };

    const ROUND_CONSTANTS = [
      0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an, 0x8000000080008000n,
      0x000000000000808bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n,
      0x000000000000008an, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an,
      0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n,
      0x8000000000008002n, 0x8000000000000080n, 0x000000000000800an, 0x800000008000000an,
      0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n,
    ];

    // Each row below contains the offsets for x = 0 through 4 at a fixed y.
    const ROTATION_OFFSETS = [
       0n,  1n, 62n, 28n, 27n,
      36n, 44n,  6n, 55n, 20n,
       3n, 10n, 43n, 25n, 39n,
      41n, 45n, 15n, 21n,  8n,
      18n,  2n, 61n, 56n, 14n,
    ];

    function rotateLeft64(lane, shift) {
      return BigInt.asUintN(64, (lane << shift) | (lane >> (64n - shift)));
    }

    function keccakF1600(state) {
      const parity = new Array(5);
      const permuted = new Array(25);

      for (const roundConstant of ROUND_CONSTANTS) {
        // Theta mixes each column with the parity of its neighbors.
        for (let x = 0; x < 5; x++) {
          parity[x] = state[x] ^ state[x + 5] ^ state[x + 10] ^ state[x + 15] ^ state[x + 20];
        }
        for (let x = 0; x < 5; x++) {
          const mix = parity[(x + 4) % 5] ^ rotateLeft64(parity[(x + 1) % 5], 1n);
          for (let y = 0; y < 5; y++) {
            state[x + 5 * y] ^= mix;
          }
        }

        // Rho and pi rotate individual lanes and move them to new coordinates.
        for (let y = 0; y < 5; y++) {
          for (let x = 0; x < 5; x++) {
            const lane = x + 5 * y;
            permuted[y + 5 * ((2 * x + 3 * y) % 5)] = rotateLeft64(state[lane], ROTATION_OFFSETS[lane]);
          }
        }

        // Chi combines lanes within a row. Iota injects the round constant.
        for (let y = 0; y < 5; y++) {
          const row = 5 * y;
          for (let x = 0; x < 5; x++) {
            state[row + x] = permuted[row + x] ^ (~permuted[row + (x + 1) % 5] & permuted[row + (x + 2) % 5]);
          }
        }
        state[0] ^= roundConstant;
      }
    }

    function keccak256Hex(bytes) {
      const rate = 136;
      const state = new Array(25).fill(0n);

      // XOR each block into the state with bytes in little-endian lanes.
      for (let offset = 0; offset <= bytes.length; offset += rate) {
        const length = Math.min(rate, bytes.length - offset);
        for (let i = 0; i < length; i++) {
          state[i >> 3] ^= BigInt(bytes[offset + i]) << BigInt(8 * (i % 8));
        }
        if (length < rate) {
          // Ethereum's Keccak suffix and the final bit of the rate block.
          state[length >> 3] ^= 0x01n << BigInt(8 * (length % 8));
          state[(rate - 1) >> 3] ^= 0x80n << 56n;
        }
        keccakF1600(state);
      }

      let hex = '';
      for (let i = 0; i < 32; i++) {
        const byte = (state[i >> 3] >> BigInt(8 * (i % 8))) & 0xffn;
        hex += byte.toString(16).padStart(2, '0');
      }
      return hex;
    }

    function toChecksumAddress(addr) {
      const hex = addr.slice(2).toLowerCase();
      const hash = keccak256Hex(Array.from(hex, (char) => char.charCodeAt(0)));
      let address = '0x';
      for (let i = 0; i < hex.length; i++) {
        address += parseInt(hash[i], 16) >= 8 ? hex[i].toUpperCase() : hex[i];
      }
      return address;
    }

    function normalizeAddress(input) {
      const clean = String(input ?? '').replace(/[\p{White_Space}\u200B-\u200D\uFEFF]/gu, '');
      if (!clean) return { ok: false, error: 'empty' };
      if (!/^0x[0-9a-fA-F]{40}$/.test(clean)) return { ok: false, error: 'format' };

      const hex = clean.slice(2);
      const address = clean.toLowerCase();
      if (/[a-f]/.test(hex) && /[A-F]/.test(hex) && clean !== toChecksumAddress(address)) {
        return { ok: false, error: 'checksum' };
      }
      return { ok: true, address };
    }

    async function submitAddress(address, fetchImpl = (url, options) => fetch(url, options)) {
      try {
        const response = await fetchImpl(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ address }),
          credentials: 'omit',
          referrerPolicy: 'no-referrer',
          redirect: 'follow',
          cache: 'no-store',
        });
        const json = JSON.parse(await response.text());
        return { ok: json?.ok === true };
      } catch {
        return { ok: false };
      }
    }

    globalThis.AddrForm = { ENDPOINT, MESSAGES, keccak256Hex, toChecksumAddress, normalizeAddress, submitAddress };

    if (typeof document !== 'undefined') {
      const form = document.getElementById('form');
      const field = document.getElementById('addr');
      const button = document.getElementById('send');
      const status = document.getElementById('status');

      function showStatus(message, state = message) {
        status.dataset.state = state;
        status.textContent = MESSAGES[message];
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (button.disabled) return;

        const normalized = normalizeAddress(field.value);
        if (!normalized.ok) {
          showStatus(normalized.error, 'error');
          return;
        }

        button.disabled = true;
        showStatus('sending');
        const result = await submitAddress(normalized.address);
        if (result.ok) field.value = '';
        showStatus(result.ok ? 'ok' : 'fail');
        button.disabled = false;
      });
    }
  </script>
</body>
</html>
